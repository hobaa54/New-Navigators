<div class="div">
    <ul class="nav justify-content-center py-3 shadow-lg">
        <div class="flex d-flex align-items-center w-100">
            <div class="line"></div>
            <div class="logo pe-3">
                <img src="../../../assets/images/logo.png" class="rounded-circle" width="50" height="50">
            </div>
            <h1 class="text-light fw-bold">نظام توجيه الطرق</h1>
            <div class="line"></div>
        </div>
    </ul>

    <p class="chose text-center my-5">اختر الطريق الذي تريد الذهاب إليه</p>
    <!--* New Edition -->
    <div class="container-fluid mt-4 p-4">
        <div class="row justify-content-center g-4">
            @for (road of roads; track road.id) {
            <div class="col-md-2">
                <div class="card h-100 shadow-sm border-0 rounded-4 road-card text-center p-4"
                    [class.selected-card]="selectedRoad === road" (click)="selectedRoad = road; showError = false"
                    (click)="goToDetails()">

                    <div class="card-icon mb-3">
                    </div>
                    <h3 class="fw-bold">{{ road.name }}</h3>
                </div>
            </div>
            }
        </div>


    </div>
